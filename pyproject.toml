[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "logbook"
version = "1.2.3"
description = "Local-first Sony recorder to Obsidian logbook pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = "CC0-1.0"
authors = [{ name = "Bernd Prager" }]
dependencies = [
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7,<8",
  "diff-cover>=9,<10",
  "mypy>=1.14,<2",
  "ruff>=0.8,<1",
]
memgraph = [
  "neo4j>=5,<6",
]
odin = [
  "faster-whisper>=1.1,<2",
  "pyannote.audio>=4,<5",
]

[project.scripts]
logbook = "logbook.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logbook"]

[tool.hatch.build.targets.wheel.force-include]
"src/logbook/static/watch" = "logbook/static/watch"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
files = ["src/logbook"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "logbook.watch_curses",
  "logbook.watch_web",
]
ignore_errors = false

[tool.coverage.run]
branch = true
source = ["src/logbook"]

[tool.coverage.report]
show_missing = true
skip_covered = false
