[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "logbook"
version = "0.1.0"
description = "Local-first Sony recorder to Obsidian logbook pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
authors = [{ name = "Bernd Prager" }]
dependencies = []

[project.scripts]
logbook = "logbook.cli:main"

[tool.ruff]
line-length = 100
