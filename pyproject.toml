[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "logbook"
version = "0.2.0"
description = "Local-first Sony recorder to Obsidian logbook pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = "CC0-1.0"
authors = [{ name = "Bernd Prager" }]
dependencies = [
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
memgraph = [
  "neo4j>=5,<6",
]
odin = [
  "faster-whisper>=1.1,<2",
  "pyannote.audio>=3.1,<4",
]

[project.scripts]
logbook = "logbook.cli:main"

[tool.ruff]
line-length = 100
