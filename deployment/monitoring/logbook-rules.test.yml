{
  "rule_files": [
    "logbook-rules.yml"
  ],
  "evaluation_interval": "30s",
  "tests": [
    {
      "interval": "30s",
      "input_series": [
        {
          "series": "logbook_service_recovery_exhausted{service=\"receiver\",job=\"mimir-node\"}",
          "values": "1x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "10m",
          "alertname": "LogbookRecoveryExhausted",
          "exp_alerts": [
            {
              "exp_labels": {
                "component": "receiver",
                "job": "mimir-node",
                "service": "logbook",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "Logbook service recovery exhausted three attempts",
                "description": "Logbook service recovery exhausted three attempts",
                "action": "Inspect service logs, fix the cause, then explicitly reset the recovery budget."
              }
            }
          ]
        }
      ]
    },
    {
      "interval": "30s",
      "input_series": [
        {
          "series": "logbook_service_healthy{service=\"receiver\",job=\"mimir-node\"}",
          "values": "0x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "10m",
          "alertname": "LogbookServiceUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "component": "receiver",
                "job": "mimir-node",
                "service": "logbook",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "An essential Logbook service is unavailable",
                "description": "An essential Logbook service is unavailable",
                "action": "Check recovery status and the affected service logs."
              }
            }
          ]
        }
      ]
    },
    {
      "interval": "30s",
      "input_series": [
        {
          "series": "logbook_supervisor_heartbeat_timestamp_seconds{job=\"mimir-node\"}",
          "values": "0x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "10m",
          "alertname": "LogbookSupervisorStale",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "mimir-node",
                "service": "logbook",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "Logbook recovery monitor stopped updating",
                "description": "Logbook recovery monitor stopped updating",
                "action": "Check the mimir boot-time supervisor and its error log."
              }
            }
          ]
        }
      ]
    },
    {
      "interval": "30s",
      "input_series": [
        {
          "series": "up{job=\"mimir-node\"}",
          "values": "0x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "10m",
          "alertname": "LogbookHostOrAPIDown",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "mimir-node",
                "service": "logbook",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "Logbook monitoring endpoint cannot be reached",
                "description": "Logbook monitoring endpoint cannot be reached",
                "action": "Check mimir power, network and the boot-time supervisor."
              }
            }
          ]
        }
      ]
    },
    {
      "interval": "30s",
      "input_series": [
        {
          "series": "logbook_remote_unpublished_age_seconds{job=\"mimir-node\"}",
          "values": "2000x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "10m",
          "alertname": "LogbookPublicationStalled",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "mimir-node",
                "service": "logbook",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "A received recording has waited over 30 minutes for publication",
                "description": "A received recording has waited over 30 minutes for publication",
                "action": "Inspect queue processing, Odin and vault synchronization; retained audio is safe."
              }
            }
          ]
        }
      ]
    },
    {
      "interval": "30s",
      "input_series": [],
      "alert_rule_test": [
        {
          "eval_time": "10m",
          "alertname": "LogbookSupervisionMissing",
          "exp_alerts": [
            {
              "exp_labels": {
                "service": "logbook",
                "severity": "critical",
                "job": "mimir-node"
              },
              "exp_annotations": {
                "summary": "Logbook supervision metrics are missing",
                "description": "Logbook supervision metrics are missing",
                "action": "Check the API version, metric scrape and supervisor installation."
              }
            }
          ]
        }
      ]
    },
    {
      "interval": "30s",
      "input_series": [
        {
          "series": "logbook_remote_unpublished_age_seconds{job=\"mimir-node\"}",
          "values": "-1x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "10m",
          "alertname": "LogbookPublicationStateUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "service": "logbook",
                "severity": "critical",
                "job": "mimir-node"
              },
              "exp_annotations": {
                "summary": "Logbook cannot inspect publication state",
                "description": "The publication monitor cannot read the recording ledger.",
                "action": "Check ledger access and the supervisor error log; do not assume the queue is empty."
              }
            }
          ]
        }
      ]
    }
  ]
}
