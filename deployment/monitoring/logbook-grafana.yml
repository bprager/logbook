apiVersion: 1
groups:
- orgId: 1
  name: Logbook service delivery
  folder: Logbook
  interval: 1m
  rules:
  - uid: logbook-service-delivery
    title: Logbook service and monitoring attention
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: hermodr-prometheus
      model:
        datasource:
          type: prometheus
          uid: hermodr-prometheus
        expr: label_replace(ALERTS{alertstate="firing",service="logbook"}, "source_alert", "$1", "alertname", "(.*)") or vector(0)
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
    noDataState: NoData
    execErrState: Error
    for: 0s
    annotations:
      summary: A service or monitoring condition needs attention.
      description: Inspect source alert labels and current evaluation. Monitoring errors do not establish a service outage.
      action: Check the source rule, metrics and affected component. Preserve retained data.
    labels:
      service: logbook
      severity: critical
    isPaused: false
